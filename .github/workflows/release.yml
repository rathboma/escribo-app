name: Release

# Runs on a pushed v* tag (create one with bin/make-release.sh) and takes it
# all the way to a public GitHub release:
#   1. create a draft release for the tag, with generated notes
#   2. build the AppImage natively on x86_64 and arm64 runners
#   3. attach both, with their latest-linux*.yml update metadata, to the draft
#      and publish it
#
# The website's /download page and both in-app updaters (escribo's own, and
# electron-updater in AppImages of the Electron 1.0.0) read the latest
# published GitHub release, so publishing is what makes a version downloadable.
# Tags with a suffix (v1.2.3-beta.1) publish as prereleases, which none of
# them picks up.
#
# Only the AppImage ships for now. deb, rpm and Flatpak build in build.yml,
# and ship once the repo publish in release-published.yml is set up. macOS and
# Windows don't build yet: src/linux.rs has no counterpart for them.
#
# Every step is safe to re-run: the draft is reused, re-uploaded assets replace
# the old ones, and publishing an already public release changes nothing.

permissions:
  contents: write # create, upload to and publish the release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create_draft_release:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # The files are named for the Cargo.toml version and the app reports it
      # to the updaters, so a tag that disagrees with it would publish files
      # named for some other release.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Work out the channel
        id: channel
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi

  build:
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix:
        # Native builds: gpui links the system's Wayland, X11 and fontconfig
        # libraries, which a cross-build would need a whole arm64 sysroot for.
        # 22.04 sets the oldest glibc the AppImage runs on (2.35).
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev libfontconfig-dev libglib2.0-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the AppImage
        run: bin/package-linux.sh appimage

      # The AppImage, plus latest-linux.yml (x86_64) or latest-linux-arm64.yml.
      # The publish job attaches them, so only it needs the release token.
      - name: Keep the files for the publish job
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.runner }}
          path: |
            dist/escribo-*.AppImage
            dist/latest-linux*.yml
          if-no-files-found: error

  publish_release:
    needs: [create_draft_release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Fetch the builds
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Attach them to the release
        run: gh release upload "$TAG" dist/* --clobber

      # The website matches these filenames by suffix (escribo-web:
      # _data/downloads.yml), so refuse to publish a release that is missing
      # one rather than ship a download button that 404s.
      - name: Check the release has every download
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          version="${TAG#v}"
          for name in \
            "escribo-$version-linux-x86_64.AppImage" \
            "escribo-$version-linux-arm64.AppImage" \
            latest-linux.yml \
            latest-linux-arm64.yml
          do
            if ! grep -qxF "$name" <<< "$assets"; then
              echo "::error::$TAG is missing $name"
              exit 1
            fi
          done

      - name: Publish release
        run: |
          if [[ "${{ needs.create_draft_release.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease
