name: Release

# Runs on a pushed v* tag (create one with `yarn release` / bin/make-release.sh)
# and takes it all the way to a public GitHub release:
#   1. create a draft release for the tag, with generated notes
#   2. build the installers and attach them to that draft
#   3. publish it, once every build has landed
#
# The website's /download page and the in-app updater both read the latest
# published GitHub release, so step 3 is what makes a version downloadable.
# Tags with a suffix (v1.2.3-beta.1) publish as prereleases, which neither of
# them picks up.
#
# Only the Linux AppImage ships for now. macOS and Windows go back in the
# matrix once signing and notarization are set up - their build steps below
# are already wired and turn signing on when the secrets exist. deb/rpm/flatpak
# need the packaging tooling and the repo publish in release-published.yml.
#
# Every step is safe to re-run: the draft is reused, re-uploaded assets replace
# the old ones, and publishing an already public release changes nothing.

permissions:
  contents: write # create, upload to and publish the release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create_draft_release:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # electron-builder names the files and picks the release from the
      # package.json version, so a tag that disagrees with it would upload
      # into some other release.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Work out the channel
        id: channel
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi

  build:
    needs: create_draft_release
    runs-on: ${{ matrix.os.name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # One runner builds both architectures: an AppImage cross-builds
          # cleanly, and the app has no native modules to compile.
          - name: ubuntu-22.04
            type: linux
          # Back in once signing + notarization are set up:
          # - name: windows-2022
          #   type: windows
          # - name: macos-14
          #   type: macos
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 100000

      # Naming the target overrides the full Linux list in package.json, which
      # stays as it is so `yarn build` and build.yml still cover every format.
      # This uploads the AppImages plus latest-linux*.yml, the metadata the
      # AppImage's auto-updater reads.
      - name: Build & upload (Linux)
        if: matrix.os.type == 'linux'
        run: yarn build --linux AppImage --x64 --arm64 --publish always

      - name: Build & upload (Windows)
        if: matrix.os.type == 'windows'
        run: yarn build --win --publish always
        env:
          # Add WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD secrets to sign.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build & upload (macOS)
        if: matrix.os.type == 'macos'
        run: yarn build --mac --universal --publish always
        env:
          # Add these secrets to sign + notarize. Until MAC_CSC_LINK is set,
          # CSC_IDENTITY_AUTO_DISCOVERY is false so the build stays unsigned
          # instead of failing to find an identity.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish_release:
    needs: [create_draft_release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # The website matches these filenames by suffix (escribo-web:
      # _data/downloads.yml), so refuse to publish a release that is missing
      # one rather than ship a download button that 404s.
      - name: Check the release has every download
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          version="${TAG#v}"
          for name in \
            "escribo-$version-linux-x86_64.AppImage" \
            "escribo-$version-linux-arm64.AppImage" \
            latest-linux.yml \
            latest-linux-arm64.yml
          do
            if ! grep -qxF "$name" <<< "$assets"; then
              echo "::error::$TAG is missing $name"
              exit 1
            fi
          done

      - name: Publish release
        run: |
          if [[ "${{ needs.create_draft_release.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease
