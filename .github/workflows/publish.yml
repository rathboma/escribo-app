name: Build & Publish

# Runs on a pushed v* tag (create one with bin/make-release.sh). Builds the
# Linux packages on x64 and arm64 and attaches them to a GitHub release, which
# is created as a draft. Publishing that draft (a manual click in the GitHub
# UI) triggers release-published.yml, which mirrors the downloads to R2 and
# publishes the apt/dnf repos.

permissions:
  contents: write # creates the draft release and uploads its assets

on:
  push:
    tags:
      - "v*"

jobs:
  create_draft_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

  release:
    needs: create_draft_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # Built on 22.04 so the binary runs on any distribution with glibc 2.35+.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev libfontconfig-dev libglib2.0-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            rpm flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build & package
        run: bin/package-linux.sh

      - name: Attach to the draft release
        run: gh release upload "$GITHUB_REF_NAME" dist/escribo-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
