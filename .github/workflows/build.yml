name: Build [non production]

# Sanity check on every PR and every push to master: the tests pass and the
# Linux app still builds and packages. This never publishes anything - it just
# proves the tree is releasable.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev libfontconfig-dev libglib2.0-dev \
            libegl1-mesa-dev libgles2-mesa-dev fonts-noto-color-emoji \
            rpm flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      # x64 only - this job just proves the build works. The release workflow
      # builds arm64 natively on an arm runner.
      - name: Build & package Linux app
        run: bin/package-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
          if-no-files-found: error
