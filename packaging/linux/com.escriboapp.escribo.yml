# Flatpak manifest. bin/package-linux.sh fills in the staged files: the
# release binary and the desktop/icon/metainfo files are copied in as built,
# nothing is compiled inside the sandbox.
app-id: com.escriboapp.escribo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: escribo
# The SDK no longer ships appstream-compose, which the flatpak-builder in
# Ubuntu 22.04 (CI) still calls; the metainfo file is installed as it is.
appstream-compose: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The Screenshots folder is watched for new shots.
  - --filesystem=xdg-pictures
  # The tray icon (StatusNotifierItem) and update notices.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: escribo
    buildsystem: simple
    build-commands:
      - cp -a usr/. /app/
      # Flatpak refuses to export icons larger than 512px.
      - rm -rf /app/share/icons/hicolor/1024x1024
    sources:
      - type: dir
        path: stage
